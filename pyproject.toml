[project]
name = "valve-controller"
version = "0.1.0"
description = "Serial valve controller GUI"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
valve-controller = "valve_controller.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valve_controller"]
